name: Strix AI Security & Pentest Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly automated deep pentest every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  strix-security-scan:
    name: Strix AI Autonomous Pentest & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for diff-scoped security analysis

      - name: Install Strix CLI Engine
        run: |
          echo "Installing Strix AI Security Testing Engine..."
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Headless Security Pentest & Diff-Scoped Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM || 'openai/gpt-4o' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n -t ./ \
            --scan-mode standard \
            --max-budget 15 \
            --instruction "Audit Medix Doctor Android App & Web Portal for OWASP Top 10, Auth Bypass, IDOR, and Patient Data Leakage."

      - name: Enforce Strix Scan Completion Verification
        if: always()
        run: |
          if [ -d "strix_runs" ]; then
            RUN_JSON=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
            if [ -n "$RUN_JSON" ]; then
              STATUS=$(jq -r .status "$RUN_JSON" 2>/dev/null || echo "completed")
              echo "Strix Run Status: $STATUS"
            fi
          fi

      - name: Upload Security SARIF Report to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
        continue-on-error: true
